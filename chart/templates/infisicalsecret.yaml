# The bot token and the Postgres password, synced from Infisical into the
# Secret the bot and Postgres read. Each Infisical secret's name becomes a key,
# so secretKeys must match those names.
{{- with .Values.infisical }}
{{- if .identityId }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "tsb.fullname" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tsb.labels" $ | nindent 4 }}
spec:
  resyncInterval: 300
  authentication:
    kubernetesAuth:
      identityId: {{ .identityId | quote }}
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: {{ .serviceAccount.name }}
        namespace: {{ .serviceAccount.namespace }}
      secretsScope:
        projectSlug: {{ required "infisical.projectSlug is required with infisical.identityId" .projectSlug | quote }}
        envSlug: {{ required "infisical.envSlug is required with infisical.identityId" .envSlug | quote }}
        secretsPath: {{ .secretsPath | quote }}
  managedKubeSecretReferences:
    # Owner: deleting this resource deletes the Secret too.
    - secretName: {{ include "tsb.secretName" $ }}
      secretNamespace: {{ $.Release.Namespace }}
      creationPolicy: Owner
{{- end }}
{{- end }}
