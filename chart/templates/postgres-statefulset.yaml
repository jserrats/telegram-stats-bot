# Postgres for the bot. The password only matters on first start, when initdb
# sets it; a copied-in data directory keeps the one it was created with, so
# POSTGRES_PASSWORD must match it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tsb.postgresName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tsb.labels" . | nindent 4 }}
    {{- include "tsb.postgresSelector" . | nindent 4 }}
spec:
  replicas: {{ .Values.postgres.replicas }}
  serviceName: {{ include "tsb.postgresName" . }}
  selector:
    matchLabels:
      {{- include "tsb.postgresSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tsb.postgresSelector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # The image's postgres user, which owns the data directory.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tsb.secretName" . }}
                  key: POSTGRES_PASSWORD
            # A subdirectory: the volume's root may hold lost+found, and
            # initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # The socket directory, which the image only makes writable for
            # its own uid when it starts as root.
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "tsb.postgresName" . }}
        - name: run
          emptyDir: {}
